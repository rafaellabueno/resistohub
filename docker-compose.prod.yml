version: "3.8"

networks:
  app_network:
    driver: bridge

services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.prod.nextjs
    env_file:
      - .env
    networks:
      - app_network
    restart: unless-stopped

  hono:
    build:
      context: .
      dockerfile: Dockerfile.prod.hono
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    env_file:
      - .env
    cap_add:
      - SYS_TIME
    restart: unless-stopped

  email-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    networks:
      - app_network
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3306:3306"
    container_name: mestrado_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: proxy_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-data:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nextjs
      - hono
      - email-api
    networks:
      - app_network
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  minio:
    image: minio/minio
    container_name: mestrado_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app_network
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      MINIO_BROWSER_REDIRECT_URL: "https://s3.resistohub.com"
      MINIO_SERVER_URL: "https://s3.resistohub.com"

    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  db-data:
  certbot-data:
  minio-data:
