networks:
  app_network:
    driver: bridge

services:
  hono:
    build:
      context: .
      dockerfile: Dockerfile.prod.hono
    ports:
      - "3334:3334"
    networks:
      - app_network
    env_file:
      - .env

  email-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "6000:6000"
    restart: unless-stopped
    volumes:
      - ./emails:/app
    networks:
      - app_network

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mc:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c " until mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY}; do
        echo 'Waiting for MinIO to be ready...';
        sleep 2; 
      done; echo 'Creating bucket: mestrado'; mc mb local/mestrado || echo 'Bucket already exists'; echo 'Initialization complete'; sleep 5 "
    restart: "no"
volumes:
  mysql_data:
  minio-data:
