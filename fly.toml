# fly.toml app configuration file generated for mestrado on 2025-08-25T20:29:04-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mestrado'
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile.prod.hono"
  
[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
