
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name resistohub.com www.resistohub.com api.resistohub.com email.resistohub.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ====================================================
    # HTTPS: DOMÍNIO PRINCIPAL (resistohub.com & www.)
    # ====================================================
    server {
        listen 443 ssl;
        server_name resistohub.com www.resistohub.com;

        ssl_certificate /etc/letsencrypt/live/resistohub.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/resistohub.com/privkey.pem;

        location ~* ^/.*\.(jpg|jpeg|png|gif|ico|svg|css|js|map|woff|woff2|ttf|eot)$ {
            set $upstream_nextjs http://nextjs:4321;
            proxy_pass $upstream_nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        
        location /_next/static/ {
            set $upstream_nextjs http://nextjs:4321;
            proxy_pass $upstream_nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Rotas Dinâmicas (Frontend)
        location / {
            set $upstream_nextjs http://nextjs:4321;
            proxy_pass $upstream_nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }
    
    # ====================================================
    # HTTPS: API HONO (api.resistohub.com)
    # ====================================================
    server {
        listen 443 ssl;
        server_name api.resistohub.com;

        ssl_certificate /etc/letsencrypt/live/resistohub.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/resistohub.com/privkey.pem;
        
        location / {
            set $upstream_hono http://hono:3334;
            proxy_pass $upstream_hono;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
    
    # ====================================================
    # HTTPS: Email API (email.resistohub.com)
    # ====================================================
    server {
        listen 443 ssl;
        server_name email.resistohub.com;

        ssl_certificate /etc/letsencrypt/live/resistohub.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/resistohub.com/privkey.pem;
        
        location / {
            set $upstream_email http://email-api:6000;
            proxy_pass $upstream_email;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 443 ssl;
        server_name s3.resistohub.com;

        ssl_certificate /etc/letsencrypt/live/resistohub.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/resistohub.com/privkey.pem;

        # Configurações de Proxy otimizadas para MinIO
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        chunked_transfer_encoding off;

        location / {
            # Se a requisição for para o Console (navegador), 
            # o MinIO interno cuida disso se as envs acima estiverem certas.
            # Aqui apontamos para a porta da API (9000).
            proxy_pass http://minio:9000;
        }

        # Opcional: Se quiser garantir que o painel funcione perfeitamente
        # via subcaminho ou headers, o MinIO usa a porta 9001 internamente.
        # Com as ENVs do passo 1, o próprio MinIO na 9000 sabe servir o console.
    }
}
