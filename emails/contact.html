<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Novo Contato</title>
  <style>
    body, p, span, ul, li, td {
      color: #333 !important;
    }

    a {
      color: #333 !important;
      text-decoration: none;
    }

    ul {
      padding-left: 20px;
    }

    .important-warning {
      color: #b61118 !important;
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f9fafc; font-family: Arial, sans-serif;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f9fafc;">
    <tr>
      <td align="center">
        <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border: 1px solid #eaeaea; border-radius: 4px;">
          <tr>
            <td align="left" style="background-color: #f0f5fa; padding: 10px; border-bottom: 1px solid #d9e3f0;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="font-size: 20px;">Novo Contato</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="left" style="padding: 20px; font-size: 16px;">
              <p>Um novo contato foi registrado no site do ResistoHub:</p>
              <p>
                <span>Nome: {{name}}</span><br />
                <span>Email: {{email}}</span><br />
                <span>Assunto: {{subject}}</span><br />
                <span>Mensagem: {{message}}</span><br />
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
